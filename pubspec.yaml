name: skullery
description: The public half of Skullery, a recipe site in Dart. Site, apps, shared UI, the larder read interface and a stub core.
publish_to: none
environment:
  sdk: ^3.13.0
# Workspace members join this list as they get code (next: packages/ui, site, apps/*).
workspace:
  - packages/larder_api
  - packages/larder_stub
dev_dependencies:
  lints: 6.1.0
