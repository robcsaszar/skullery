publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  jaspr: 0.23.5
  jaspr_router: 0.9.0
  larder_api:
    path: ../packages/larder_api
  larder_select:
    path: ../packages/larder_select
dev_dependencies:
  build_runner: 2.15.1
  build_web_compilers: 4.8.5
  jaspr_builder: 0.23.5
  jaspr_cli: 0.23.5
  larder_stub:
    path: ../packages/larder_stub
  lints: 6.1.0
  test: 1.31.1
jaspr:
  mode: static
